name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci needs the lockfile to match package.json exactly, which also
      # means a stale lockfile fails here rather than in a deploy.
      - name: Install
        run: npm ci

      # frontend/public/pokemonList.json is generated and gitignored, but it is
      # fetched at runtime rather than imported, so none of the steps below need it.
      - name: Typecheck
        run: npx tsc --noEmit --project frontend/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  schema:
    name: Generated schema files are current
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The committed types are generated from the migrations. If a migration
      # changes the schema and nobody regenerates, every RPC call keeps
      # type-checking against a schema the database no longer has — exactly the
      # drift the typed client exists to catch.
      - name: Start Supabase
        run: npx supabase start

      - name: Regenerate types
        run: npx supabase gen types typescript --local > frontend/src/types/database.ts

      # Functions live in migrations as a pile of CREATE OR REPLACE statements,
      # so functions_current/ is the only place their present-day definition is
      # readable. It is generated, so it rots the moment it stops being checked.
      - name: Redump function definitions
        run: npm run dump:functions

      - name: Fail if either differs from what is committed
        run: |
          if ! git diff --exit-code -- frontend/src/types/database.ts; then
            echo "::error::frontend/src/types/database.ts is out of date. Run 'npm run gen:types --workspace=frontend' and commit the result."
            exit 1
          fi
          if ! git diff --exit-code -- supabase/functions_current; then
            echo "::error::supabase/functions_current is out of date. Run 'npm run dump:functions' and commit the result."
            exit 1
          fi
